<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>auto-onion — lineage graph</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root { --bg:#0b0e14; --panel:#11151c; --line:#222b38; --fg:#e6edf3; --dim:#8b949e;
          --green:#16a34a; --red:#dc2626; --blue:#2563eb; --purple:#7c3aed; --teal:#0d7377; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); overflow:hidden;
         font-family: ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; }
  header { padding:11px 18px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; letter-spacing:.5px; }
  header h1 .on { color:#e3b341; }
  header .sub { color:var(--dim); font-size:12px; }
  header #runpick { background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:3px 8px; font:inherit; font-size:11px; max-width:300px; cursor:pointer; }
  header .tbtn { background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:4px 11px; font:inherit; font-size:12px; cursor:pointer; }
  header .tbtn:hover { border-color:var(--dim); }
  header .tbtn.run { border-color:#1f6f3a; color:#3fb950; }
  header .tbtn:disabled { opacity:.55; cursor:default; }
  .dlabel { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.6px; margin:11px 0 3px; }
  .dval { font-size:12.5px; line-height:1.55; color:var(--fg); white-space:pre-wrap; word-break:break-word; }
  header .best { margin-left:auto; font-size:12px; color:var(--dim); }
  header .best b { color:var(--green); font-size:20px; }
  main { display:grid; grid-template-columns: 1fr 380px; height:calc(100vh - 46px); }
  #graphwrap { position:relative; overflow:hidden; }
  #graph { display:block; width:100%; height:100%; cursor:grab; }
  #graph:active { cursor:grabbing; }
  .hud { position:absolute; left:12px; bottom:12px; display:flex; gap:6px; }
  .hud button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
                border-radius:6px; width:28px; height:28px; cursor:pointer; font-size:14px; }
  .hud button:hover { border-color:var(--dim); }
  .legend { position:absolute; right:12px; top:12px; background:rgba(17,21,28,.86);
            border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:11px; color:var(--dim); line-height:1.8; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .sidebar { border-left:1px solid var(--line); padding:14px; overflow:auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .card h2 { font-size:11px; color:var(--dim); margin:0 0 9px; font-weight:600; letter-spacing:.6px; }
  .kv { font-size:12px; line-height:1.75; }
  .kv .k { color:var(--dim); display:inline-block; width:78px; }
  .pill { font-size:10px; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.4px; }
  .pill.kept,.pill.green { background:rgba(22,163,74,.16); color:#3fb950; }
  .pill.reverted,.pill.red,.pill.failed { background:rgba(220,38,38,.16); color:#f85149; }
  .pill.running { background:rgba(37,99,235,.18); color:#58a6ff; }
  .pill.baseline { background:rgba(124,58,237,.18); color:#a371f7; }
  pre.code { background:#0a0d12; border:1px solid var(--line); border-radius:8px; padding:10px;
             font-size:11px; line-height:1.5; overflow:auto; max-height:46vh; color:#c9d1d9; white-space:pre; }
  .hint { color:var(--dim); font-size:11px; }
  .node text { font-family: ui-monospace, Consolas, monospace; pointer-events:none; }
  .zone-label { fill:var(--dim); font-size:11px; font-weight:600; letter-spacing:1.5px; opacity:.6; }
</style>
</head>
<body>
  <header>
    <h1>auto-<span class="on">onion</span> <span class="sub">dashboard</span></h1>
    <button id="btnrun" class="tbtn run" title="run the two loops on TSP (offline, ~20s)">▶ Run two-loop</button>
    <button id="btndemo" class="tbtn" title="load a real engine run">★ Demo</button>
    <select id="runpick" title="choose a run to view"></select>
    <span class="sub" id="task">loading…</span>
    <div class="best">best&nbsp; <b id="best">—</b> vs baseline</div>
  </header>
  <main>
    <div id="graphwrap">
      <svg id="graph"></svg>
      <div class="legend">
        <div><i style="background:var(--purple)"></i>second loop · changes architecture</div>
        <div><i style="background:var(--green)"></i>kept &nbsp; <i style="background:var(--red)"></i>reverted &nbsp; <i style="background:var(--blue)"></i>running</div>
        <div>◆ second loop &nbsp; ▶ architecture &nbsp; ● experiment</div>
      </div>
      <div class="hud">
        <button id="zin" title="zoom in">+</button>
        <button id="zout" title="zoom out">−</button>
        <button id="zfit" title="fit">⊡</button>
      </div>
    </div>
    <aside class="sidebar">
      <div class="card">
        <h2>SELECTED NODE</h2>
        <div id="detail"><span class="hint">Click a node to see its hypothesis and result.</span></div>
      </div>
    </aside>
  </main>

<script>
const $ = (id) => document.getElementById(id);
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
const C = {
  origin:"#374151", benchmark:"#0d7377", second_loop:"#7c3aed", ground_container:"#6b7280",
  green:"#16a34a", red:"#dc2626", blue:"#2563eb", baseline:"#6d28d9",
};
const SIB = 210, DEP = 84;         // sibling spacing, depth spacing (vertical layout)
let svg, gMain, gZones, gLinks, gNodes, zoom;
let transform = null, didFit = false, selectedId = null, lastTree = null;
let expanded = new Set();          // run ids whose ground experiments are shown
let currentRun = "";               // which run dir the viewer is showing

function idOf(d){ return d.data.id || (d.data.type+"/"+d.data.name); }
// Collapse experiments by default (like omnididdy): a run shows its `ground`
// container of L1 experiments only when expanded. Default view = the L2
// architecture trunk; click a run to reveal its parameter-tuning experiments.
function prune(node){
  const c = Object.assign({}, node);
  if (node.children && node.children.length){
    const collapsible = node.type==="run" && node.children.some(k=>k.type==="ground_container");
    let kids = node.children;
    if (collapsible && !expanded.has(node.id)) kids = kids.filter(k=>k.type!=="ground_container");
    c.children = kids.map(prune);
    c._collapsible = collapsible;
    c._collapsed = collapsible && !expanded.has(node.id);
  }
  return c;
}
function autoExpandBest(tree){
  let best=null, bv=Infinity;
  (function w(n){ if(n.type==="run" && n.best_loss!=null && n.best_loss<bv){bv=n.best_loss;best=n;} (n.children||[]).forEach(w); })(tree);
  if (best) expanded.add(best.id);
}

function nodeColor(d){
  const n = d.data, t = n.type;
  if (t==="origin") return C.origin;
  if (t==="benchmark") return C.benchmark;
  if (t==="second_loop") return C.second_loop;
  if (t==="ground_container") return C.ground_container;
  if (t==="run"){
    if (n.active) return C.blue;
    if (n.run_rank==="baseline") return C.baseline;
    if (n.run_rank==="green") return C.green;
    if (n.run_rank==="running") return C.blue;
    return C.red;
  }
  // ground_experiment
  if (n.status==="running") return C.blue;
  if (n.status==="kept" || n.improved) return C.green;
  return C.red;
}
function nodeRadius(d){
  const t = d.data.type;
  return t==="origin"?15: t==="benchmark"?13: t==="second_loop"?11: t==="run"?10: t==="ground_container"?8: 6;
}
function shapePath(d){
  const r = nodeRadius(d), t = d.data.type;
  if (t==="second_loop"){ const s=r*0.85; return `M${-s},${-s} L${s},${-s} L${s},${s} L${-s},${s} Z`; }
  if (t==="run"){ const s=r*1.15; return `M${-s*0.7},${-s*0.8} L${s*0.9},0 L${-s*0.7},${s*0.8} Z`; }  // triangle ▶
  return null; // circle
}
function fmt(v){ return (v==null || !isFinite(v)) ? "—" : Number(v).toFixed(4); }
function ancestorBaseline(d){ let p=d.parent; while(p){ if(p.data.baseline_loss!=null) return p.data.baseline_loss; p=p.parent; } return 1.0; }
function pctOf(d){
  const n=d.data; const v = n.val_loss!=null?n.val_loss:n.best_loss;
  if (v==null || !isFinite(v)) return null;
  const base = ancestorBaseline(d); if(!base) return null;
  return (v - base)/base*100;
}
function shortName(s, k=26){ s=s||""; return s.length>k ? s.slice(0,k-1)+"…" : s; }
function labelText(d){
  const t=d.data.type;
  if (t==="origin") return "origin";
  if (t==="benchmark") return d.data.name;
  if (t==="second_loop") return "second loop";
  if (t==="ground_container") return "ground";
  if (t==="run") return d.data.run_rank==="baseline" ? "baseline" : shortName(d.data.name);
  return shortName(d.data.hypothesis || d.data.name, 22);
}

function linkClass(l){
  const t=l.target.data;
  if (t.status==="running" || t.active) return "blue";
  if (t.status==="kept" || t.improved || t.run_rank==="green" || t.run_rank==="baseline") return "kept";
  return "rev";
}

function mount(){
  svg = d3.select("#graph");
  gMain = svg.append("g");
  gZones = gMain.append("g");
  gLinks = gMain.append("g");
  gNodes = gMain.append("g");
  zoom = d3.zoom().scaleExtent([0.15,3]).on("zoom", (e)=>{ transform=e.transform; gMain.attr("transform", e.transform); });
  svg.call(zoom).on("dblclick.zoom", null);
  $("zin").onclick = ()=> svg.transition().call(zoom.scaleBy, 1.3);
  $("zout").onclick = ()=> svg.transition().call(zoom.scaleBy, 1/1.3);
  $("zfit").onclick = ()=> fit(true);
}

function layout(tree){
  const root = d3.hierarchy(prune(tree));
  d3.tree().nodeSize([SIB, DEP])(root);
  return root;
}

function render(tree){
  const root = layout(tree);
  const nodes = root.descendants(), links = root.links();
  const X = d => d.y, Y = d => d.x;   // horizontal: depth->x, sibling->y

  // links (curved, top-down)
  const link = d3.linkVertical().x(d=>d.x).y(d=>d.y);
  const lsel = gLinks.selectAll("path").data(links, d=>d.target.data.id || (d.target.data.type+d.target.data.name));
  lsel.join(
    en => en.append("path").attr("fill","none").attr("stroke-width",1.6)
            .attr("stroke", d=>({kept:"#1d5e34",blue:"#1e3a8a",rev:"#5b1d1d"}[linkClass(d)]))
            .attr("d", link),
    up => up.attr("stroke", d=>({kept:"#1d5e34",blue:"#1e3a8a",rev:"#5b1d1d"}[linkClass(d)])).attr("d", link),
    ex => ex.remove()
  );

  // zone bands (SECOND LOOP / GROUND LOOP) — horizontal bands, mirrors omnididdy tree-v
  gZones.selectAll("*").remove();
  let slPos=null, runMax=-Infinity, mainMax=-Infinity, crossMin=Infinity, crossMax=-Infinity;
  nodes.forEach(d=>{ const m=d.y, c=d.x; mainMax=Math.max(mainMax,m); crossMin=Math.min(crossMin,c); crossMax=Math.max(crossMax,c);
                     if(d.data.type==="second_loop") slPos=m; if(d.data.type==="run") runMax=Math.max(runMax,m); });
  if (slPos!=null && isFinite(runMax)){
    const x1=crossMin-150, x2=crossMax+220;
    [slPos+DEP*0.5, runMax+DEP*0.5].forEach(py=> gZones.append("line").attr("x1",x1).attr("x2",x2).attr("y1",py).attr("y2",py)
        .attr("stroke","#30363d").attr("stroke-dasharray","4,5").attr("opacity",.35));
    gZones.append("text").attr("class","zone-label").attr("x",x1+6).attr("y",(slPos+runMax)/2)
        .attr("text-anchor","start").attr("fill","#a371f7").text("SECOND LOOP · ARCHITECTURE");
    gZones.append("text").attr("class","zone-label").attr("x",x1+6).attr("y",(runMax+mainMax)/2+DEP)
        .attr("text-anchor","start").attr("fill","#2dd4bf").text("GROUND LOOP · PARAMETERS");
  }

  // nodes
  const nsel = gNodes.selectAll("g.node").data(nodes, d=>d.data.id || (d.data.type+"/"+d.data.name));
  const en = nsel.enter().append("g").attr("class","node").style("cursor","pointer")
      .on("click", (e,d)=>{ selectedId = idOf(d);
        if (d.data._collapsible){ const id=d.data.id; expanded.has(id)?expanded.delete(id):expanded.add(id); if(lastTree) render(lastTree); }
        showDetail(d); paintSelection(); });
  en.each(function(d){
    const g=d3.select(this), p=shapePath(d);
    if(p) g.append("path").attr("class","body").attr("d",p);
    else g.append("circle").attr("class","body").attr("r",nodeRadius(d));
    g.append("circle").attr("class","ring").attr("r",nodeRadius(d)+5).attr("fill","none")
        .attr("stroke","#e6edf3").attr("stroke-width",1.5).attr("stroke-dasharray","3,2").attr("opacity",0);
    g.append("text").attr("class","lab").attr("dy","0.32em").attr("font-size",11.5).attr("font-weight",500).attr("fill","#e6edf3");
    g.append("text").attr("class","sub").attr("dy","1.5em").attr("font-size",9.5).attr("fill","#8b949e");
  });
  const merge = en.merge(nsel);
  merge.attr("transform", d=>`translate(${d.x},${d.y})`);
  merge.select(".body").attr("fill", d=>nodeColor(d))
       .attr("stroke", d=>d3.color(nodeColor(d)).darker(0.6)).attr("stroke-width",1.3);
  merge.each(function(d){
    const g=d3.select(this), r=nodeRadius(d);
    const tx = r+8, anchor = "start";              // vertical layout: labels to the right
    g.select(".lab").attr("x",tx).attr("text-anchor",anchor).text(labelText(d));
    // sub-label: metric + % delta for runs & experiments
    const sub = g.select(".sub").attr("x",tx).attr("text-anchor",anchor); sub.selectAll("tspan").remove();
    const parts=[];
    if (d.data.type==="run" || d.data.type==="ground_experiment"){
      const v = d.data.val_loss!=null?d.data.val_loss:d.data.best_loss;
      if (v!=null && isFinite(v)) parts.push({t:fmt(v), c:"#8b949e"});
      const pct = pctOf(d);
      if (pct!=null && Math.abs(pct)>=0.05) parts.push({t:(pct>0?"+":"")+pct.toFixed(1)+"%", c: pct<0?"#3fb950":"#8b949e"});
    }
    parts.forEach((p,i)=>{ sub.append("tspan").text(p.t).attr("fill",p.c); if(i<parts.length-1) sub.append("tspan").text("  ").attr("fill","#586069"); });
    // expand/collapse caret on runs that hold experiments
    let caret = g.select(".caret");
    if (d.data._collapsible){
      if (caret.empty()) caret = g.append("text").attr("class","caret").attr("dy","0.32em").attr("font-size",10).attr("fill","#8b949e").attr("pointer-events","none");
      caret.attr("x", r+6).attr("text-anchor","start").text(d.data._collapsed ? "▸" : "▾");
    } else if (!caret.empty()) caret.remove();
  });
  nsel.exit().remove();
  paintSelection();

  if (!didFit){ fit(false); didFit=true; }
  else if (transform){ gMain.attr("transform", transform); }
}

function paintSelection(){
  gNodes.selectAll("g.node").select(".ring")
    .attr("opacity", d=> (selectedId === (d.data.id || (d.data.type+"/"+d.data.name))) ? 1 : 0);
}

function fit(animate){
  const node = gMain.node(); if(!node) return;
  const b = node.getBBox(); const wrap = $("graphwrap");
  const W = wrap.clientWidth, Hh = wrap.clientHeight, pad=70;
  const scale = Math.min(1.1, (W-pad*2)/(b.width||1), (Hh-pad*2)/(b.height||1));
  const tx = (W - b.width*scale)/2 - b.x*scale;
  const ty = (Hh - b.height*scale)/2 - b.y*scale;
  const t = d3.zoomIdentity.translate(tx,ty).scale(scale);
  transform = t;
  (animate ? svg.transition().duration(400) : svg).call(zoom.transform, t);
}

function statusOf(d){
  const n=d.data;
  if (n.type==="run") return n.run_rank;
  if (n.type==="ground_experiment") return n.status;
  return n.type.replace("_"," ");
}
function levelOf(d){
  const t=d.data.type;
  if (t==="run") return d.data.run_rank==="baseline" ? "L2 · baseline architecture" : "L2 · architecture (second loop)";
  if (t==="ground_experiment") return d.data.iter===0 ? "L1 · install" : "L1 · refinement (ground loop)";
  if (t==="second_loop") return "second loop proposer";
  if (t==="benchmark") return "benchmark";
  return t;
}

function showDetail(d){
  const n=d.data, st=statusOf(d);
  const v = n.val_loss!=null ? n.val_loss : n.best_loss;
  const pct = pctOf(d);
  let result = "—";
  if (v!=null && isFinite(v)){
    result = "score " + fmt(v);
    if (pct!=null && Math.abs(pct)>=0.05) result += `   ·   ${Math.abs(pct).toFixed(1)}% ${pct<0?"better":"worse"} than baseline`;
  }
  $("detail").innerHTML =
      `<div style="margin-bottom:6px"><span class="pill ${st}">${st}</span></div>`
    + `<div class="dlabel">Hypothesis</div><div class="dval">${esc(n.hypothesis || n.name || "—")}</div>`
    + `<div class="dlabel">Result</div><div class="dval">${result}</div>`;
}

async function tick(){
  try{
    const s = await (await fetch("/api/state?run=" + encodeURIComponent(currentRun))).json();
    $("task").textContent = s.task || "";
    $("best").textContent = (s.best_improvement_pct==null||s.empty) ? "—" : (s.best_improvement_pct>0?"+":"")+Number(s.best_improvement_pct).toFixed(2)+"%";
    if (!s.tree){ return; }
    if (!didFit) autoExpandBest(s.tree);
    lastTree = s.tree;
    render(s.tree);
  }catch(e){ /* keep retrying */ }
}
async function loadRuns(){
  try{
    const r = await (await fetch("/api/runs")).json();
    const sel = $("runpick"); sel.innerHTML = "";
    (r.runs||[]).forEach(it=>{ const o=document.createElement("option"); o.value=it.run;
      const best=(it.best!=null)?` (${it.best>0?"+":""}${Number(it.best).toFixed(1)}%)`:"";
      o.textContent=(it.demo?"demo · ":"")+it.run+best; sel.appendChild(o); });
    if(!currentRun) currentRun = r.default || ((r.runs[0]||{}).run) || "";
    sel.value = currentRun;
    sel.onchange = ()=> resetView(sel.value);
  }catch(e){}
}
function resetView(run){
  currentRun = run; didFit = false; expanded = new Set(); selectedId = null; lastBest = null;
  $("detail").innerHTML = '<span class="hint">Click a node to see its hypothesis and result.</span>';
  tick();
}
async function doRun(){
  const b = $("btnrun"); b.disabled = true; b.textContent = "running…";
  try{
    const r = await (await fetch("/api/run", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"})).json();
    await loadRuns(); $("runpick").value = r.run; resetView(r.run);
  }catch(e){}
  setTimeout(()=>{ b.disabled = false; b.textContent = "▶ Run two-loop"; }, 1800);
}
async function doDemo(){
  try{
    const r = await (await fetch("/api/runs")).json();
    const demo = (r.runs||[]).find(x=>x.demo) || (r.runs||[])[0];
    if(demo){ $("runpick").value = demo.run; resetView(demo.run); }
  }catch(e){}
}
mount();
$("btnrun").onclick = doRun; $("btndemo").onclick = doDemo;
loadRuns().then(tick); setInterval(tick, 1500);
</script>
</body>
</html>
