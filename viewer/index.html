<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>auto-onion — live viewer</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e;
          --green:#3fb950; --red:#f85149; --blue:#58a6ff; --yellow:#d29922; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:18px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; letter-spacing:.5px; }
  header .sub { color:var(--dim); font-size:12px; }
  .best { margin-left:auto; font-size:14px; }
  .best b { color:var(--green); font-size:22px; }
  main { display:grid; grid-template-columns: 1fr 520px; gap:18px; padding:18px 22px; align-items:start; }
  @media (max-width: 1000px){ main { grid-template-columns:1fr; } }
  .arch { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          margin-bottom:12px; overflow:hidden; }
  .arch > .head { display:flex; align-items:center; gap:10px; padding:11px 14px;
                  border-left:4px solid var(--line); }
  .arch.kept > .head { border-left-color:var(--green); }
  .arch.reverted > .head { border-left-color:var(--red); }
  .arch.running > .head { border-left-color:var(--yellow); }
  .arch .cyc { color:var(--dim); font-size:11px; }
  .arch .name { font-weight:600; font-size:13px; }
  .arch .ceil { margin-left:auto; font-size:13px; }
  .badge { font-size:10px; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.5px; }
  .badge.kept { background:rgba(63,185,80,.15); color:var(--green); }
  .badge.reverted, .badge.failed { background:rgba(248,81,73,.15); color:var(--red); }
  .badge.running { background:rgba(210,153,34,.15); color:var(--yellow); }
  .exps { padding:4px 14px 10px 18px; }
  .exp { display:flex; align-items:center; gap:10px; padding:4px 0; font-size:12px;
         border-top:1px dashed var(--line); }
  .exp:first-child { border-top:none; }
  .exp .dot { width:8px; height:8px; border-radius:50%; flex:none; background:var(--dim); }
  .exp.kept .dot { background:var(--green); } .exp.installed .dot{ background:var(--blue);}
  .exp.reverted .dot, .exp.failed .dot { background:var(--red); }
  .exp .it { color:var(--dim); width:42px; }
  .exp .imp { width:64px; text-align:right; }
  .exp .imp.pos { color:var(--green); } .exp .imp.neg{ color:var(--dim);} .exp .imp.fail{ color:var(--red);}
  .exp .hyp { color:var(--fg); opacity:.85; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .right { position:sticky; top:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:12px; color:var(--dim); margin:0 0 8px; font-weight:600; letter-spacing:.5px; }
  canvas { width:100%; height:auto; background:#0a0d12; border-radius:8px; display:block; }
  .tourmeta { display:flex; justify-content:space-between; color:var(--dim); font-size:12px; margin-top:8px; }
  .legend { color:var(--dim); font-size:11px; margin-top:10px; line-height:1.7; }
  .legend span { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle;}
</style>
</head>
<body>
  <header>
    <h1>auto-onion</h1>
    <span class="sub" id="task">loading…</span>
    <div class="best">best so far&nbsp; <b id="best">—</b> <span class="sub">vs baseline</span></div>
  </header>
  <main>
    <section id="tree"></section>
    <section class="right">
      <div class="card">
        <h2 id="tourtitle">BEST TOUR</h2>
        <canvas id="canvas" width="490" height="490"></canvas>
        <div class="tourmeta"><span id="tourname"></span><span id="tourlen"></span></div>
        <div class="legend">
          <div><span style="background:#3fb950"></span>kept (new best) &nbsp;
               <span style="background:#f85149"></span>reverted &nbsp;
               <span style="background:#d29922"></span>running &nbsp;
               <span style="background:#58a6ff"></span>installed</div>
          <div>L2 = architecture cycles · L1 = refinement iterations within each architecture</div>
        </div>
      </div>
    </section>
  </main>

<script>
const $ = (id) => document.getElementById(id);

function impClass(v){ if(v===null||v===undefined) return "fail"; return v>0 ? "pos" : "neg"; }
function impText(v){ if(v===null||v===undefined) return "fail"; return (v>0?"+":"")+v.toFixed(2)+"%"; }

function renderTree(s){
  const tree = $("tree");
  tree.innerHTML = "";
  (s.architectures||[]).forEach(a => {
    const div = document.createElement("div");
    div.className = "arch " + a.status;
    const exps = (a.experiments||[]).map(e => `
      <div class="exp ${e.status}">
        <div class="dot"></div>
        <div class="it">L1·${e.iter}</div>
        <div class="imp ${impClass(e.improvement_pct)}">${impText(e.improvement_pct)}</div>
        <div class="hyp">${(e.hypothesis||"").replace(/</g,"&lt;")} <span style="color:#586069">[${e.status}]</span></div>
      </div>`).join("");
    div.innerHTML = `
      <div class="head">
        <span class="cyc">L2 · cycle ${a.cycle}</span>
        <span class="name">${(a.name||"").replace(/</g,"&lt;")}</span>
        <span class="ceil imp ${impClass(a.improvement_pct)}">${impText(a.improvement_pct)} ceiling</span>
        <span class="badge ${a.status}">${a.status}</span>
      </div>
      <div class="exps">${exps}</div>`;
    tree.appendChild(div);
  });
}

function drawTour(t){
  const c = $("canvas"), ctx = c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);
  if(!t || !t.cities || !t.cities.length){ $("tourname").textContent=""; $("tourlen").textContent=""; return; }
  const pad = 26, W = c.width-2*pad, H = c.height-2*pad;
  const xs = t.cities.map(p=>p[0]), ys = t.cities.map(p=>p[1]);
  const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const sx = v => pad + (maxx>minx ? (v-minx)/(maxx-minx) : .5)*W;
  const sy = v => pad + (maxy>miny ? (v-miny)/(maxy-miny) : .5)*H;
  // edges
  ctx.strokeStyle="#3fb950"; ctx.lineWidth=1.5; ctx.beginPath();
  t.order.forEach((idx,k)=>{ const p=t.cities[idx]; const X=sx(p[0]),Y=sy(p[1]);
    if(k===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y); });
  const first=t.cities[t.order[0]]; ctx.lineTo(sx(first[0]),sy(first[1])); ctx.stroke();
  // nodes
  t.cities.forEach(p=>{ ctx.fillStyle="#58a6ff"; ctx.beginPath();
    ctx.arc(sx(p[0]),sy(p[1]),3,0,7); ctx.fill(); });
  $("tourname").textContent = "instance: " + (t.name||"");
  $("tourlen").textContent = "length: " + (t.length!==undefined ? t.length.toFixed(1) : "");
}

async function tick(){
  try{
    const s = await (await fetch("/api/state")).json();
    $("task").textContent = s.task || "";
    $("best").textContent = (s.best_improvement_pct!==null && s.best_improvement_pct!==undefined && !s.empty)
        ? (s.best_improvement_pct>0?"+":"")+Number(s.best_improvement_pct).toFixed(2)+"%" : "—";
    renderTree(s);
    drawTour(s.best_tour);
  }catch(e){ /* viewer keeps trying */ }
}
tick(); setInterval(tick, 1500);
</script>
</body>
</html>
