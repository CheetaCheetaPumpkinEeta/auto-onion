<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>auto-onion — lineage graph</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e;
          --green:#3fb950; --red:#f85149; --blue:#58a6ff; --gold:#e3b341; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); overflow:hidden;
         font-family: ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace; }
  header { padding:13px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; letter-spacing:.5px; }
  header h1 .on { color:var(--gold); }
  header .sub { color:var(--dim); font-size:12px; }
  header .best { margin-left:auto; font-size:13px; color:var(--dim); }
  header .best b { color:var(--green); font-size:21px; }
  main { display:grid; grid-template-columns: 1fr 320px; height:calc(100vh - 50px); }
  #graphwrap { overflow:auto; position:relative; }
  #graph { display:block; }
  .sidebar { border-left:1px solid var(--line); padding:14px; overflow:auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:12px; margin-bottom:12px; }
  .card h2 { font-size:11px; color:var(--dim); margin:0 0 9px; font-weight:600; letter-spacing:.6px; }
  .kv { font-size:12px; line-height:1.7; }
  .kv .k { color:var(--dim); display:inline-block; width:74px; }
  .pill { font-size:10px; padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.4px; }
  .pill.kept { background:rgba(63,185,80,.15); color:var(--green); }
  .pill.reverted,.pill.failed { background:rgba(248,81,73,.15); color:var(--red); }
  .pill.running { background:rgba(227,179,65,.15); color:var(--gold); }
  canvas { width:100%; height:auto; background:#0a0d12; border-radius:8px; display:block; }
  .tourmeta { display:flex; justify-content:space-between; color:var(--dim); font-size:11px; margin-top:7px; }
  .legend { color:var(--dim); font-size:11px; line-height:1.9; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .hint { color:var(--dim); font-size:11px; margin-top:6px; }
  /* graph elements */
  .edge { fill:none; stroke:var(--line); stroke-width:1.5; }
  .edge.kept { stroke:#26602f; }
  .edge.spine { stroke:var(--green); stroke-width:2.6; }
  .node { cursor:pointer; }
  .node text { fill:var(--fg); font-size:11px; }
  .node .imp { fill:var(--dim); font-size:10px; }
  .node:hover .hit { stroke:var(--fg); stroke-width:1.5; }
</style>
</head>
<body>
  <header>
    <h1>auto-<span class="on">onion</span> <span class="sub">lineage graph</span></h1>
    <span class="sub" id="task">loading…</span>
    <div class="best">best&nbsp; <b id="best">—</b> vs baseline</div>
  </header>
  <main>
    <div id="graphwrap"><svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <aside class="sidebar">
      <div class="card" id="detailcard">
        <h2>NODE</h2>
        <div id="detail" class="kv"><span class="hint">Hover a node in the graph.</span></div>
      </div>
      <div class="card">
        <h2 id="tourtitle">BEST TOUR</h2>
        <canvas id="canvas" width="280" height="280"></canvas>
        <div class="tourmeta"><span id="tourname"></span><span id="tourlen"></span></div>
      </div>
      <div class="card">
        <h2>LEGEND</h2>
        <div class="legend">
          <div><i style="background:var(--blue)"></i>baseline (root)</div>
          <div><i style="background:var(--green)"></i>kept — extends the trunk</div>
          <div><i style="background:var(--red)"></i>reverted — dead-end branch</div>
          <div><i style="background:var(--gold)"></i>★ current best</div>
          <div style="margin-top:6px">◆ architecture (L2) &nbsp; ● refinement (L1)</div>
        </div>
      </div>
    </aside>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
let nodeById = {};

const COLOR = { baseline:"var(--blue)", kept:"var(--green)", reverted:"var(--red)",
                failed:"var(--red)", running:"var(--gold)" };
function fill(n){ return n.kind==="baseline" ? COLOR.baseline : (COLOR[n.status]||"var(--dim)"); }
function impText(v){ return (v===null||v===undefined) ? "fail" : (v>0?"+":"")+Number(v).toFixed(2)+"%"; }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function layout(nodes){
  const map = {}; nodes.forEach(n => map[n.id] = Object.assign({}, n, {kids:[]}));
  let root = null;
  nodes.forEach(n => { if (n.parent && map[n.parent]) map[n.parent].kids.push(n.id); else root = root||n.id; });
  // mark the path from root to the best node so we can draw it as a straight spine
  const onPath = new Set();
  const best = nodes.find(n => n.is_best);
  if (best){ let c = best.id; while(c){ onPath.add(c); c = (map[c].parent && map[c].parent in map) ? map[c].parent : null; } }
  // order children: the spine child first (keeps the winning lineage as the top line)
  Object.values(map).forEach(n => n.kids.sort((a,b)=>{
    const pa = onPath.has(a)?0:1, pb = onPath.has(b)?0:1;
    return pa-pb || (map[a].cycle-map[b].cycle) || (map[a].iter-map[b].iter);
  }));
  const X = 132, Y = 46, PADX = 70, PADY = 48;
  let slot = 0;
  (function place(id, depth){
    const n = map[id]; n.x = PADX + depth*X;
    if (n.kids.length===0){ n.y = PADY + slot*Y; slot++; }
    else { n.kids.forEach(k => place(k, depth+1)); n.y = (map[n.kids[0]].y + map[n.kids[n.kids.length-1]].y)/2; }
  })(root, 0);
  return { map, root, onPath };
}

function render(state){
  const svg = $("graph");
  svg.innerHTML = "";
  nodeById = {};
  const nodes = state.nodes || [];
  if (!nodes.length){ svg.setAttribute("width",460); svg.setAttribute("height",120);
    svg.innerHTML = `<text x="24" y="60" fill="#8b949e" font-size="13">no run yet — run:  python run.py --mock</text>`; return; }
  const { map, onPath } = layout(nodes);
  let maxX=0, maxY=0; Object.values(map).forEach(n => { nodeById[n.id]=n; maxX=Math.max(maxX,n.x); maxY=Math.max(maxY,n.y); });
  svg.setAttribute("width",  maxX + 240);
  svg.setAttribute("height", maxY + 90);

  // edges
  Object.values(map).forEach(n => {
    if (!(n.parent && map[n.parent])) return;
    const p = map[n.parent], dx = (n.x - p.x)/2;
    const path = document.createElementNS(SVGNS,"path");
    const spine = onPath.has(n.id) && onPath.has(p.id);
    path.setAttribute("class","edge " + (spine ? "spine" : (n.status==="kept"?"kept":"")));
    path.setAttribute("d", `M ${p.x} ${p.y} C ${p.x+dx} ${p.y}, ${n.x-dx} ${n.y}, ${n.x} ${n.y}`);
    svg.appendChild(path);
  });

  // nodes
  Object.values(map).forEach(n => {
    const g = document.createElementNS(SVGNS,"g");
    g.setAttribute("class","node"); g.setAttribute("transform",`translate(${n.x},${n.y})`);
    g.dataset.id = n.id;
    if (n.is_best){
      const ring = document.createElementNS(SVGNS,"circle");
      ring.setAttribute("r",16); ring.setAttribute("fill","none");
      ring.setAttribute("stroke","var(--gold)"); ring.setAttribute("stroke-width",2); g.appendChild(ring);
      const star = document.createElementNS(SVGNS,"text");
      star.setAttribute("y",-21); star.setAttribute("text-anchor","middle");
      star.setAttribute("fill","var(--gold)"); star.setAttribute("font-size",13); star.textContent="★"; g.appendChild(star);
    }
    let hit;
    if (n.kind === "exp"){
      hit = document.createElementNS(SVGNS,"circle"); hit.setAttribute("r",6);
    } else {                       // baseline or architecture node
      if (n.kind === "baseline"){ hit = document.createElementNS(SVGNS,"circle"); hit.setAttribute("r",11); }
      else { hit = document.createElementNS(SVGNS,"rect");      // diamond for architectures
             hit.setAttribute("x",-11); hit.setAttribute("y",-11); hit.setAttribute("width",22);
             hit.setAttribute("height",22); hit.setAttribute("rx",4);
             hit.setAttribute("transform","rotate(45)"); }
      // label above, improvement below
      const lab = document.createElementNS(SVGNS,"text");
      lab.setAttribute("y",-19); lab.setAttribute("text-anchor","middle");
      lab.textContent = n.kind==="baseline" ? "baseline" : shortName(n.label);
      g.appendChild(lab);
      const imp = document.createElementNS(SVGNS,"text");
      imp.setAttribute("class","imp"); imp.setAttribute("y",26); imp.setAttribute("text-anchor","middle");
      imp.textContent = impText(n.improvement_pct); g.appendChild(imp);
    }
    hit.setAttribute("class","hit"); hit.setAttribute("fill", fill(n));
    if (n.status==="reverted"||n.status==="failed") hit.setAttribute("opacity",".72");
    g.appendChild(hit);
    svg.appendChild(g);
  });
}

function shortName(s){
  s = (s||"").replace(/^tuned PARAM.*/,"refinement");
  return s.length > 22 ? s.slice(0,21)+"…" : s;
}

function showDetail(id){
  const n = nodeById[id]; if(!n) return;
  const lvl = n.kind==="exp" ? `L1 refinement (cycle ${n.cycle}, iter ${n.iter})`
            : n.kind==="baseline" ? "L2 baseline (root)" : `L2 architecture (cycle ${n.cycle})`;
  $("detail").innerHTML =
    `<div style="margin-bottom:7px"><span class="pill ${n.status}">${n.status}</span>`
    + (n.is_best?` <span class="pill" style="background:rgba(227,179,65,.15);color:var(--gold)">★ best</span>`:``) + `</div>`
    + `<div class="kv"><span class="k">level</span>${lvl}</div>`
    + `<div class="kv"><span class="k">improve</span>${impText(n.improvement_pct)}</div>`
    + `<div class="kv"><span class="k">fitness</span>${n.fitness}</div>`
    + `<div class="kv"><span class="k">parent</span>${n.parent||"— (root)"}</div>`
    + `<div class="kv" style="margin-top:7px;color:var(--fg)">${esc(n.label)}</div>`;
}

function drawTour(t){
  const c = $("canvas"), ctx = c.getContext("2d"); ctx.clearRect(0,0,c.width,c.height);
  if(!t||!t.cities||!t.cities.length){ $("tourname").textContent=""; $("tourlen").textContent=""; return; }
  const pad=18, W=c.width-2*pad, H=c.height-2*pad, xs=t.cities.map(p=>p[0]), ys=t.cities.map(p=>p[1]);
  const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  const sx=v=>pad+(mxx>mnx?(v-mnx)/(mxx-mnx):.5)*W, sy=v=>pad+(mxy>mny?(v-mny)/(mxy-mny):.5)*H;
  ctx.strokeStyle="#3fb950"; ctx.lineWidth=1.4; ctx.beginPath();
  t.order.forEach((idx,k)=>{const p=t.cities[idx],X=sx(p[0]),Y=sy(p[1]); k?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});
  const f=t.cities[t.order[0]]; ctx.lineTo(sx(f[0]),sy(f[1])); ctx.stroke();
  t.cities.forEach(p=>{ctx.fillStyle="#58a6ff";ctx.beginPath();ctx.arc(sx(p[0]),sy(p[1]),2.5,0,7);ctx.fill();});
  $("tourname").textContent="instance: "+(t.name||""); $("tourlen").textContent="length: "+(t.length?t.length.toFixed(1):"");
}

$("graphwrap").addEventListener("mouseover", e => {
  const g = e.target.closest("[data-id]"); if (g) showDetail(g.dataset.id);
});

let lastBest = null;
async function tick(){
  try{
    const s = await (await fetch("/api/state")).json();
    $("task").textContent = s.task || "";
    $("best").textContent = (s.empty||s.best_improvement_pct==null) ? "—"
        : (s.best_improvement_pct>0?"+":"")+Number(s.best_improvement_pct).toFixed(2)+"%";
    render(s);
    drawTour(s.best_tour);
    // keep the best node's details showing by default
    const best = (s.nodes||[]).find(n=>n.is_best);
    if (best && best.id!==lastBest){ showDetail(best.id); lastBest=best.id; }
  }catch(e){ /* keep retrying */ }
}
tick(); setInterval(tick, 1500);
</script>
</body>
</html>
